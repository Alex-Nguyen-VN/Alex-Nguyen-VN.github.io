    link-external-icon: true
    link-external-newwindow: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    toc: true
    code-link: true
    code-fold: true
    code-tools: true
    googlefonts:
      - Varela+Round
      - Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i
      - Inter:300,400,500,600,700
    css: /css/styles.css
    include-in-header:
      - includes/header.html
      - text: |
          <script type="text/javascript" src="/js/scripts.js"></script>
          <meta name="description" content="Alex Nguyen - Data Scientist & Business Analyst Portfolio. Exploring data insights, analytics projects, and business intelligence solutions.">
          <meta name="keywords" content="data science, data analysis, business analytics, R, Python, SQL, machine learning, portfolio, energy analytics, predictive modeling">
          <meta name="author" content="Alex Nguyen">
          <meta name="robots" content="index, follow">
          <meta property="og:title" content="Alex Nguyen - Data Scientist & Business Analyst">
          <meta property="og:description" content="Data Scientist & Business Analyst passionate about transforming complex data into actionable insights.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://alexnguyen.github.io/">
          <meta property="og:image" content="https://alexnguyen.github.io/profile.jpg">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Alex Nguyen - Data Scientist & Business Analyst">
          <meta name="twitter:description" content="Data Scientist & Business Analyst passionate about transforming complex data into actionable insights.">
          <meta name="twitter:image" content="https://alexnguyen.github.io/profile.jpg">
          <link rel="canonical" href="https://alexnguyen.github.io/">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <meta name="theme-color" content="#64a19d">
          <link rel="apple-touch-icon" href="/assets/favicon.ico">
          <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    include-after-body: includes/footer.html

editor: visual
execute:
  freeze: true


